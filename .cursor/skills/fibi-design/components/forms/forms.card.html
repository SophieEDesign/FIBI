<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.lbl{font:var(--type-caption);color:var(--text-tertiary);letter-spacing:var(--ls-caps);text-transform:uppercase;margin:0 0 8px}.grp{display:flex;flex-direction:column;gap:8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Field,Input,Textarea,Select,Checkbox,Radio,Switch,SearchField,Icon}=window.FIBIDesignSystem_383abe;
function App(){const [q,setQ]=React.useState("Lisbon");const [c,setC]=React.useState(true);const [r,setR]=React.useState("recent");const [s,setS]=React.useState(true);
return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
<div style={{display:"grid",gap:14}}>
<SearchField value={q} onChange={setQ} onClear={()=>setQ("")}/>
<Field label="Place name" htmlFor="n"><Input id="n" defaultValue="Time Out Market" iconLeft={<Icon name="map-pin" size={16}/>}/></Field>
<Field label="Link" hint="Pasted or shared from any app"><Input placeholder="https://" iconLeft={<Icon name="link" size={16}/>}/></Field>
<Field label="Email" error="Enter a valid email"><Input defaultValue="hello@" error/></Field>
</div>
<div style={{display:"grid",gap:14}}>
<Field label="Collection"><Select options={["All places","Lisbon","Weekend trips","Coffee"]}/></Field>
<Field label="Note"><Textarea rows={2} defaultValue="Go early — the seafood counter gets busy."/></Field>
<div className="row" style={{gap:20}}><Checkbox checked={c} onChange={setC} label="Remember me"/><Checkbox label="Visited"/></div>
<div className="row" style={{gap:20}}><Radio name="s" value="recent" checked={r==="recent"} onChange={setR} label="Recent"/><Radio name="s" value="az" checked={r==="az"} onChange={setR} label="A–Z"/></div>
<Switch checked={s} onChange={setS} label="Show visited places"/>
</div></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
