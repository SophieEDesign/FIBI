<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Indigo-tinted, wide and soft — never black shadows" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="sw" style="padding:6px 2px 2px"><div><div style="height:62px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)"></div><span class="n">xs</span><span class="v">--shadow-xs</span></div><div><div style="height:62px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span class="n">sm</span><span class="v">--shadow-sm</span></div><div><div style="height:62px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><span class="n">md</span><span class="v">--shadow-md</span></div><div><div style="height:62px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span class="n">lg</span><span class="v">--shadow-lg</span></div><div><div style="height:62px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div><span class="n">xl</span><span class="v">--shadow-xl</span></div><div><div style="height:62px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-pin)"></div><span class="n">pin</span><span class="v">--shadow-pin</span></div></div></body></html>
