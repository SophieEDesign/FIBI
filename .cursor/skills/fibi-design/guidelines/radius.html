<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="sw"><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-xs)"></div><span class="n">xs</span><span class="v">--radius-xs</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="v">--radius-sm</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-md)"></div><span class="n">md</span><span class="v">--radius-md</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-lg)"></div><span class="n">lg</span><span class="v">--radius-lg</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-xl)"></div><span class="n">xl</span><span class="v">--radius-xl</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-2xl)"></div><span class="n">2xl</span><span class="v">--radius-2xl</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-3xl)"></div><span class="n">3xl</span><span class="v">--radius-3xl</span></div><div><div style="height:56px;background:var(--sky-100);border:1px solid var(--sky-200);border-radius:var(--radius-pill)"></div><span class="n">pill</span><span class="v">--radius-pill</span></div></div></body></html>
