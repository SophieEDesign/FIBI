<!-- @dsCard group="Motion" viewport="700x150" name="Duration &amp; easing" subtitle="Fast, short, decelerating — nothing bounces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 28px"><div class="kv"><span class="tok">--dur-instant</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">80ms · state flips</span></div><div class="kv"><span class="tok">--dur-fast</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">130ms · hover, focus</span></div><div class="kv"><span class="tok">--dur-base</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">190ms · toggles, toasts</span></div><div class="kv"><span class="tok">--dur-slow</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">280ms · sheets, dialogs</span></div><div class="kv"><span class="tok">--dur-page</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">420ms · route changes</span></div><div class="kv"><span class="tok">--ease-standard</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">cubic-bezier(.2,.6,.2,1)</span></div><div class="kv"><span class="tok">--ease-out</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">cubic-bezier(.16,1,.3,1)</span></div><div class="kv"><span class="tok">--press-scale</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">0.985 · press feedback</span></div></div></body></html>
