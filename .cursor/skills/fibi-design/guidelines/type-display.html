<!-- @dsCard group="Type" viewport="700x180" name="Display &amp; headings" subtitle="Semibold, tight tracking, short lines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="rowlist">
<div class="kv"><span style="font:var(--fw-semibold) 44px/1.04 var(--font-sans);letter-spacing:var(--ls-tighter)">Display</span><span class="tok">--fs-display · 40–64px / 1.04 / -0.032em</span></div>
<div class="kv"><span style="font:var(--type-h1);letter-spacing:var(--ls-tight)">Heading 1</span><span class="tok">--type-h1 · 40/1.1</span></div>
<div class="kv"><span style="font:var(--type-h2);letter-spacing:var(--ls-tight)">Heading 2</span><span class="tok">--type-h2 · 30/1.16</span></div>
<div class="kv"><span style="font:var(--type-h3)">Heading 3</span><span class="tok">--type-h3 · 22/1.25</span></div>
<div class="kv"><span style="font:var(--type-h4)">Heading 4</span><span class="tok">--type-h4 · 18/1.35</span></div></div></body></html>
