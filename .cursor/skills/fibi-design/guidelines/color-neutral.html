<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals" subtitle="Surfaces, borders and text — warm-free, near-black at 900" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="sw"><div><div class="chip" style="background:var(--neutral-0)"></div><span class="n">0</span><span class="v">--neutral-0</span></div><div><div class="chip" style="background:var(--neutral-50)"></div><span class="n">50</span><span class="v">--neutral-50</span></div><div><div class="chip" style="background:var(--neutral-100)"></div><span class="n">100</span><span class="v">--neutral-100</span></div><div><div class="chip" style="background:var(--neutral-200)"></div><span class="n">200</span><span class="v">--neutral-200</span></div><div><div class="chip" style="background:var(--neutral-300)"></div><span class="n">300</span><span class="v">--neutral-300</span></div><div><div class="chip" style="background:var(--neutral-400)"></div><span class="n">400</span><span class="v">--neutral-400</span></div><div><div class="chip" style="background:var(--neutral-500)"></div><span class="n">500</span><span class="v">--neutral-500</span></div><div><div class="chip" style="background:var(--neutral-600)"></div><span class="n">600</span><span class="v">--neutral-600</span></div><div><div class="chip" style="background:var(--neutral-700)"></div><span class="n">700</span><span class="v">--neutral-700</span></div><div><div class="chip" style="background:var(--neutral-800)"></div><span class="n">800</span><span class="v">--neutral-800</span></div><div><div class="chip" style="background:var(--neutral-900)"></div><span class="n">900</span><span class="v">--neutral-900</span></div><div><div class="chip" style="background:var(--neutral-950)"></div><span class="n">950</span><span class="v">--neutral-950</span></div></div></body></html>
