<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:center">
<div style="background:var(--indigo-900);border-radius:var(--radius-lg);display:grid;place-items:center;height:130px"><img src="../assets/fibi-logo-dark.png" style="width:110px"></div>
<div style="background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);display:grid;place-items:center;height:130px"><img src="../assets/fibi-logo-light.png" style="width:110px"></div>
<div style="background:var(--gradient-brand-soft);border-radius:var(--radius-lg);display:grid;place-items:center;height:130px"><img src="../assets/fibi-logo-full.png" style="width:86px"></div>
<div style="background:var(--bg-inset);border-radius:var(--radius-lg);display:grid;place-items:center;height:130px"><img src="../assets/fibi-mark.png" style="height:76px"></div></div></body></html>
