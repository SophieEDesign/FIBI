<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 28px"><div class="kv"><span class="tok">--container-max</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">1120px</span></div><div class="kv"><span class="tok">--container-narrow</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">720px</span></div><div class="kv"><span class="tok">--container-prose</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">640px</span></div><div class="kv"><span class="tok">--gutter-desktop</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">32px</span></div><div class="kv"><span class="tok">--gutter-mobile</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">20px</span></div><div class="kv"><span class="tok">--app-width</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">390px</span></div><div class="kv"><span class="tok">--app-topbar-h</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">56px</span></div><div class="kv"><span class="tok">--app-tabbar-h</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">64px</span></div><div class="kv"><span class="tok">--control-h-sm</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">32px</span></div><div class="kv"><span class="tok">--control-h-md</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">40px</span></div><div class="kv"><span class="tok">--control-h-lg</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">48px</span></div><div class="kv"><span class="tok">--section-y</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">96px</span></div></div></body></html>
