<!-- @dsCard group="Colors" viewport="700x140" name="Orchid" subtitle="The gradient's midpoint — accents and visited pins only" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="sw"><div><div class="chip" style="background:var(--orchid-50)"></div><span class="n">50</span><span class="v">--orchid-50</span></div><div><div class="chip" style="background:var(--orchid-100)"></div><span class="n">100</span><span class="v">--orchid-100</span></div><div><div class="chip" style="background:var(--orchid-200)"></div><span class="n">200</span><span class="v">--orchid-200</span></div><div><div class="chip" style="background:var(--orchid-300)"></div><span class="n">300</span><span class="v">--orchid-300</span></div><div><div class="chip" style="background:var(--orchid-400)"></div><span class="n">400</span><span class="v">--orchid-400</span></div><div><div class="chip" style="background:var(--orchid-500)"></div><span class="n">500</span><span class="v">--orchid-500</span></div><div><div class="chip" style="background:var(--orchid-600)"></div><span class="n">600</span><span class="v">--orchid-600</span></div><div><div class="chip" style="background:var(--orchid-700)"></div><span class="n">700</span><span class="v">--orchid-700</span></div></div></body></html>
