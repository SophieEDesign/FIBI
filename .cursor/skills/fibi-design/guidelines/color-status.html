<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Success, warning, danger and info pairs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="sw"><div><div class="chip" style="background:var(--status-success-bg);color:var(--status-success-fg);display:grid;place-items:center;font:var(--type-label)">Success</div><span class="v">--status-success-bg</span><span class="v">--status-success-fg</span></div><div><div class="chip" style="background:var(--status-warn-bg);color:var(--status-warn-fg);display:grid;place-items:center;font:var(--type-label)">Warning</div><span class="v">--status-warn-bg</span><span class="v">--status-warn-fg</span></div><div><div class="chip" style="background:var(--status-danger-bg);color:var(--status-danger-fg);display:grid;place-items:center;font:var(--type-label)">Danger</div><span class="v">--status-danger-bg</span><span class="v">--status-danger-fg</span></div><div><div class="chip" style="background:var(--status-info-bg);color:var(--status-info-fg);display:grid;place-items:center;font:var(--type-label)">Info</div><span class="v">--status-info-bg</span><span class="v">--status-info-fg</span></div></div></body></html>
