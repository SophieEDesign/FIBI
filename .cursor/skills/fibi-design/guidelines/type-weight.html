<!-- @dsCard group="Type" viewport="700x140" name="Weights &amp; tracking" subtitle="400 and 500 do most of the work; 600 for headings" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div class="sw"><div><div style="font:300 26px/1.2 var(--font-sans);letter-spacing:-0.02em">Aa</div><span class="n">Light</span><span class="v">--fw-light</span></div><div><div style="font:400 26px/1.2 var(--font-sans);letter-spacing:-0.02em">Aa</div><span class="n">Regular</span><span class="v">--fw-regular</span></div><div><div style="font:500 26px/1.2 var(--font-sans);letter-spacing:-0.02em">Aa</div><span class="n">Medium</span><span class="v">--fw-medium</span></div><div><div style="font:600 26px/1.2 var(--font-sans);letter-spacing:-0.02em">Aa</div><span class="n">Semibold</span><span class="v">--fw-semibold</span></div><div><div style="font:700 26px/1.2 var(--font-sans);letter-spacing:-0.02em">Aa</div><span class="n">Bold</span><span class="v">--fw-bold</span></div>
<div><div style="font:var(--fw-medium) 12px/1.2 var(--font-sans);letter-spacing:var(--ls-caps);text-transform:uppercase;padding-top:10px">Eyebrow</div><span class="n">Caps</span><span class="v">--ls-caps 0.11em</span></div></div></body></html>
