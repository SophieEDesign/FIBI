<!-- @dsCard group="Colors" viewport="700x180" name="Semantic aliases" subtitle="Always reach for these in components, not the raw ramps" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 20px;background:var(--bg-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sw>div{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(16,16,40,.06)}
.n{font:var(--type-caption);color:var(--text-primary);font-weight:var(--fw-medium)}
.v{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:baseline;gap:10px}
.tok{font:var(--type-mono);font-size:11px;color:var(--text-tertiary)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 28px"><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--bg-page);flex:0 0 auto"></span><span class="tok">--bg-page</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Page background</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--surface-card);flex:0 0 auto"></span><span class="tok">--surface-card</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Card surface</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--text-primary);flex:0 0 auto"></span><span class="tok">--text-primary</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Primary text</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--text-secondary);flex:0 0 auto"></span><span class="tok">--text-secondary</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Secondary text</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--text-tertiary);flex:0 0 auto"></span><span class="tok">--text-tertiary</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Tertiary / meta</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--border-subtle);flex:0 0 auto"></span><span class="tok">--border-subtle</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Hairline border</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--accent);flex:0 0 auto"></span><span class="tok">--accent</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Accent / primary action</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--accent-soft);flex:0 0 auto"></span><span class="tok">--accent-soft</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Tinted accent fill</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--pin-default);flex:0 0 auto"></span><span class="tok">--pin-default</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Map pin, default</span></div><div class="kv"><span style="width:18px;height:18px;border-radius:6px;border:1px solid rgba(16,16,40,.08);background:var(--pin-saved);flex:0 0 auto"></span><span class="tok">--pin-saved</span><span style="font:var(--type-caption);color:var(--text-secondary);margin-left:auto">Map pin, saved</span></div></div></body></html>
